<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1993 OAD. pick 'em and stick 'em.</title>

    <link
      rel="icon"
      type="image/png"
      href="https://www.pngfind.com/pngs/m/523-5231197_patrick-reed-celebrating-ultimate-software-patrick-reed-hd.png"
    />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      referrerpolicy="no-referrer"
    />

    <!-- Bootstrap 5 (replaces your dead Pingendo Bootstrap 4 beta) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #0f1115;
        --panel: #151922;
        --panel-2: #1b2030;
        --border: #2a3244;
        --text: #e8edf6;
        --muted: #aab3c5;

        --brand: #22c55e;
        --danger: #ef4444;

        --radius: 12px;
      }

      * {
        font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }

      body {
        background: var(--bg);
        color: var(--text);
        padding-bottom: 90px; /* room for fixed bottom nav */
      }

      /* Main page wrapper */
      section { padding-top: 28px; }

      .app-shell {
        max-width: 980px;
        margin: 0 auto;
        padding: 0 16px;
      }

      .app-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 22px;
      }

      /* Typography */
      /* Titles — brand coloured but dark-mode friendly */
      h1 {
        color: #34d399;   /* emerald green */
        font-weight: 800;
      }

      h2 {
        color: #facc15;   /* gold */
        font-weight: 700;
      }

      h3 {
        color: #a7f3d0;   /* softer green for hierarchy */
        font-weight: 700;
      }

      /* Optional: subtle section subtitles */
      .subtitle,
      .text-muted-title {
        color: #93c5fd;   /* cool soft blue accent */
      }

      p  { color: var(--muted); }

      a { color: var(--text); }
      a:hover { color: var(--brand); }

      /* Inputs */
      input[type="text"],
      input[type="password"],
      input[type="email"],
      select,
      textarea {
        background: var(--panel-2) !important;
        border: 1px solid var(--border) !important;
        color: var(--text) !important;
        border-radius: 10px !important;
        padding: 12px 14px !important;
        box-shadow: none !important;
      }
      input::placeholder, textarea::placeholder { color: rgba(232,237,246,0.45); }
      input:focus, select:focus, textarea:focus {
        border-color: rgba(34,197,94,0.8) !important;
        outline: none !important;
        box-shadow: none !important;
      }

      /* Buttons (works for your existing .button class) */
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 12px 16px;
        border-radius: 10px;
        border: 1px solid rgba(34,197,94,0.55);
        background: var(--brand);
        color: #07110b;
        font-weight: 800;
        transition: filter 0.15s ease;
      }
      .button:hover { filter: brightness(1.05); }
      .button:active { filter: brightness(0.98); }

      .button.disabled,
      .disabled {
        opacity: 0.55;
        background: #2a2f3a;
        border-color: #2a2f3a;
        color: var(--text);
        cursor: not-allowed;
      }

      /* Tables */
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        background: var(--panel);
        font-size: 0.9rem;
      }

      th {
        padding: 10px 8px;
        background: var(--panel-2);
        color: var(--text);
        font-weight: 800;
        border-bottom: 1px solid var(--border);
        text-align: center;
        white-space: nowrap;
      }

      td {
        padding: 9px 8px;
        color: var(--text);
        border-bottom: 1px solid var(--border);
        text-align: center;
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        cursor: pointer;
      }

      tr:last-child td { border-bottom: none; }
      tr:hover td { background: rgba(255,255,255,0.03); }

      /* Keep your “red” columns, but more subtle */
      td:nth-child(3),
      td:nth-child(4) { color: rgba(239,68,68,0.95); }

      .league-picks td:nth-child(3),
      .league-picks td:nth-child(4) { color: var(--text); }

      /* Bottom navbar */
      .navbar.fixed-bottom {
        background: var(--panel);
        border-top: 1px solid var(--border);
      }

      .bottom-nav-wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .nav-link {
        color: var(--text) !important;
        font-weight: 700;
        padding: 8px 10px !important;
        border-radius: 10px;
      }
      .nav-link:hover { background: rgba(255,255,255,0.04); }

      .nav-icon {
        width: 38px;
        height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: var(--panel-2);
        border: 1px solid var(--border);
      }

      body {
        padding-bottom: calc(90px + env(safe-area-inset-bottom));
      }

      .navbar.fixed-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }


      /* Dropdown */
      .dropdown-menu {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 8px;
      }
      .dropdown-item {
        color: var(--text);
        border-radius: 10px;
        padding: 10px 10px;
      }
      .dropdown-item:hover { background: rgba(255,255,255,0.05); }
      .dropdown-divider { border-top: 1px solid var(--border); }

      @media (max-width: 420px) {
        .nav-text { display: none; }
        .app-card { padding: 16px; }
      }
    </style>


  </head>

  <body>
    <section>
      <div class="app-shell">
        <div class="app-card">
          {% block content %}{% endblock %}
        </div>
      </div>
    </section>

    <!-- Bottom navbar -->
    <nav class="navbar fixed-bottom">
      <div class="container bottom-nav-wrap px-3">
        {% if current_user.is_authenticated %}
        <div class="btn-group dropup">
          <button
            class="btn btn-sm btn-outline-light dropdown-toggle d-inline-flex align-items-center gap-2"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <span class="nav-icon"><i class="fa-solid fa-user"></i></span>
            <span class="nav-text">My Profile</span>
          </button>
          <div class="dropdown-menu dropdown-menu-start">
            <a href="{{ url_for('auth.logout') }}" class="dropdown-item">
              <i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Logout
            </a>
            <div class="dropdown-divider"></div>

            {% if current_user.is_admin %}
            <a href="{{ url_for('main.update') }}" class="dropdown-item">
              <i class="fa-solid fa-shield-halved me-2"></i>Admin
            </a>
            {% endif %}

            <a href="{{ url_for('main.update_password') }}" class="dropdown-item">
              <i class="fa-solid fa-key me-2"></i>Update Password
            </a>

            <a href="{{ url_for('main.update_display_name') }}" class="dropdown-item">
              <i class="fa-solid fa-pen-to-square me-2"></i>Update Team Name
            </a>

            <a href="{{ url_for('main.profile') }}" class="dropdown-item">
              <i class="fa-solid fa-clock-rotate-left me-2"></i>Pick History
            </a>
          </div>
        </div>

        <div class="d-flex align-items-center gap-2">
          <a class="nav-link d-inline-flex align-items-center gap-2" href="{{ url_for('main.league') }}">
            <span class="nav-icon"><i class="fa-solid fa-trophy"></i></span>
            <span class="nav-text">League</span>
          </a>

          <a class="nav-link d-inline-flex align-items-center gap-2" href="{{ url_for('main.pick') }}">
            <span class="nav-icon"><i class="fa-solid fa-ticket"></i></span>
            <span class="nav-text">Pick</span>
          </a>
        </div>

        {% else %}
        <div class="d-flex align-items-center gap-2 w-100 justify-content-between">
          <a class="nav-link d-inline-flex align-items-center gap-2" href="{{ url_for('auth.login') }}">
            <span class="nav-icon"><i class="fa-solid fa-right-to-bracket"></i></span>
            <span class="nav-text">Login</span>
          </a>

          <a class="nav-link d-inline-flex align-items-center gap-2" href="{{ url_for('auth.signup') }}">
            <span class="nav-icon"><i class="fa-solid fa-user-plus"></i></span>
            <span class="nav-text">Sign Up</span>
          </a>
        </div>
        {% endif %}
      </div>
    </nav>

    <!-- Bootstrap 5 JS (no jQuery required) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
